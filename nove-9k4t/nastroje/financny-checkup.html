čný príjem, v 40 už 3×, v 50 6×. Dobehnúť sa to dá len pravidelnou investíciou a časom, preto začni tento mesiac.",tool:Z.rentova},priemer:{title:"Si na ceste, ale tempo treba zrýchliť",text:"S rastom príjmu zvyšuj aj mesačnú investíciu. Každé zvýšenie o 50 € mesačne je za 25 rokov desiatky tisíc eur.",tool:Z.rentova},dobra:{title:"Dlhodobé úspory zodpovedajú veku",text:"Drž kurz. Raz ročne si over, či ti projekcia sedí s cieľovou rentou.",tool:Z.rentova}},dsti:{slaba:{title:"Splátky ti berú priveľkú časť príjmu",text:"Nad 35 % príjmu na splátkach je ťažko, nad 50 % kriticky. Najprv splať najdrahší úver, potom rokuj o konsolidácii alebo predĺžení hypotéky.",tool:Z.uverova},priemer:{title:"Splátky sú zvládnuteľné, ale ber to ako strop",text:"Pod 20 % príjmu je pohodlné pásmo. Nový úver si dovoľ, len ak ostane rezerva aj miera úspor.",tool:Z.hypo},dobra:{title:"Dlhy máš pod kontrolou",text:"Ak máš lacnú hypotéku, porovnaj si, či sa oplatí splácať mimoriadne, alebo radšej investovať.",tool:Z.hypo}},discipline:{slaba:{title:"Vyčisti úverovú históriu",text:"Záznam v registri ti zdraží alebo znemožní hypotéku na roky. Dohodni splátkový kalendár, splácaj načas a po 12 mesiacoch čistej histórie sa situácia otočí."},priemer:{title:"Vybuduj čistú históriu",text:"Občasné meškanie alebo nulová história znižujú tvoju úverovú kapacitu. Jeden malý záväzok splácaný vzorne históriu buduje.",tool:Z.uverova},dobra:{title:"Banka ťa vidí ako bezpečného klienta",text:"Udrž si to. Pri každej žiadosti o úver si porovnaj ponuky viacerých bánk, tvoja pozícia je silná."}},insurance:{slaba:{title:"Zabezpeč príjem, nie veci",text:"Dlhodobá PN alebo invalidita je väčšie riziko než požiar bytu. Rieš najprv poistenie príjmu a smrti, ak od teba niekto závisí. Zvyšok pokryje rezerva."},priemer:{title:"Prever, čo tvoje poistenie naozaj kryje",text:"Sumy nastav podľa hypotéky, príjmu a počtu ľudí, ktorí od teba závisia, nie podľa toho, čo ponúkol agent."},dobra:{title:"Ochrana je nastavená",text:"Poistenie si prejdi pri každej väčšej zmene: nová hypotéka, dieťa, zmena príjmu. Inak ho netreba riešiť."}},plans:{slaba:{title:"Daj svojim peniazom plán",text:"Bez plánu rozhodujú náhody a reklama. Stanov si tri ciele s termínom a sumou, rozdeľ ich na mesačné odklady a sleduj ich raz mesačne.",tool:Z.rentova},priemer:{title:"Z plánu v hlave urob plán na papieri",text:"Napíš si ciele, sumy a termíny. Čo je napísané, sa deje. Raz štvrťročne si to prejdi."},dobra:{title:"Plánuješ dopredu",text:"Máš návyk, ktorý chýba väčšine. Prepoj plány s číslami: cieľová renta, vek a potrebný mesačný vklad.",tool:Z.rentova}},investRate:{slaba:{title:"Začni investovať pravidelne, aj s malou sumou",text:"Čas je tvoj najsilnejší spojenec. 100 € mesačne pri 8 % ročne je za 30 rokov okolo 150 000 €. Nastav automatický vklad do nízkonákladového ETF.",tool:Z.investicna},priemer:{title:"Zdvihni mesačnú investíciu k 15 až 20 % príjmu",text:"Investuješ, ale tempo ťa k rente nedovedie. Každé zvýšenie príjmu rozdeľ: polovicu do investície, polovicu do života.",tool:Z.investicna},dobra:{title:"Investuješ dosť, drž kurz",text:"Stratégiu si prejdi raz ročne, nie pri každom poklese trhu. Sleduj poplatky, tie rozhodujú o výsledku viac než výber fondu.",tool:Z.semafor}},fees:{slaba:{title:"Zisti, čo ťa investície stoja",text:"Poplatky 2 až 3 % ročne zoberú za 30 rokov aj polovicu výnosu. Prever produkty, ktoré máš, a porovnaj ich s lacným ETF.",tool:Z.rontgen},priemer:{title:"Prever produkt, ktorý máš, a poplatky do detailu",text:"„Približne viem“ pri poplatkoch stojí tisíce. Vypýtaj si od poskytovateľa celkovú nákladovosť (TER, vstupný, správcovský, výkonnostný).",tool:Z.rontgen},dobra:{title:"Investuješ efektívne",text:"Lacné ETF a stratégia na papieri sú základ, ktorý väčšina nemá. Ďalší krok je daňová efektivita a rebalansovanie.",tool:Z.semafor}}},Mp=380,li=Lt.length+qi.length,Tp=e=>new Intl.NumberFormat("sk-SK",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number.isFinite(e)?e:
