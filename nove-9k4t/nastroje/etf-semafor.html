o padli akcie, čo robili dlhopisy, ako dlho trvalo zotavenie. Kto pozná históriu, nepanikári, keď sa zopakuje."},{t:"Netuším 😳",e:"😳",p:0,shock:!0,tip:"<b>Dot-com 2000, hypotéky 2008, covid 2020 — tri úplne iné krízy, jedno spoločné: kto vydržal, zarobil.</b> Kto nepozná, ako krízy vyzerajú, predáva presne vtedy, keď má kupovať."}]},{c:"S",q:"Vieš, prečo máš presne taký pomer akcií a dlhopisov, aký máš?",a:[{t:"Áno — vychádza z môjho horizontu a cieľa",e:"🎯",p:2},{t:"Nastavil mi ho niekto, dôvod presne nepoznám",e:"🤷",p:1,tip:"<b>Pomer akcií a dlhopisov je najdôležitejšie rozhodnutie celého portfólia</b> — dôležitejšie než výber konkrétneho ETF. Ak nepoznáš dôvod, nevieš ani, či ešte platí."},{t:"Neviem, aký pomer vlastne mám 😳",e:"😳",p:0,shock:!0,tip:"<b>Toto je ako šoférovať bez vedomia, akou rýchlosťou ideš.</b> Pomer akcií a dlhopisov určuje, koľko zarobíš aj koľko môžeš stratiť. Prvý krok auditu: zistiť, čo vlastne držíš."}]},{c:"P",q:"Vieš, aký máš celkový ročný poplatok naprieč všetkým, kde investuješ?",a:[{t:"Viem presné číslo",e:"🧮",p:2},{t:"Tuším, ale nepočítal som to",e:"🤔",p:1,tip:"<b>Poplatok je jediná vec na trhu, ktorú máš na 100 % pod kontrolou.</b> Spočítaj si vážený priemer všetkých svojich produktov — pri väčšine ľudí vyjde nepríjemné prekvapenie."},{t:"Netuším 😳",e:"😳",p:0,shock:!0,tip:"<b>Presne preto väčšina ľudí netuší, koľko ich investovanie stojí — poplatok nikdy nevidia na výpise.</b> Strháva sa potichu z hodnoty. Rozdiel 1–2 % ročne = desaťtisíce eur za investičný život."}]},{c:"P",q:"Vieš, do čoho presne investuješ — aké firmy, regióny, meny?",a:[{t:"Viem — poznám zloženie svojho portfólia",e:"🗺️",p:2},{t:"Zhruba",e:"🤔",p:1,tip:"<b>„Zhruba” znamená, že nevieš, aké riziko nesieš.</b> Otvor si factsheet svojho fondu/ETF: top 10 pozícií, regióny, meny. Zaberie to 10 minút a často zmení celý pohľad."},{t:"„Mám nejaký fond v banke” 😳",e:"😳",p:0,shock:!0,tip:"<b>Vlastníš niečo, o čom nevieš nič — a platíš za to poplatky.</b> Prvý krok: zisti názov fondu, otvor jeho KID a factsheet. Druhý krok: porovnaj poplatky a zloženie s nízkonákladovou alternatívou."}]},{c:"P",q:"Koľko % portfólia máš v jednom ETF?",a:[{t:"20 – 40 %",e:"🛡️",p:2},{t:"Viac ako 50 %",e:"🟡",p:1,tip:"<b>Záleží, aké ETF to je.</b> Polovica portfólia v širokom svetovom indexe je niečo iné ako polovica v úzkom tematickom ETF (AI, čisté energie, jeden sektor) — to druhé je koncentrovaná stávka, nie diverzifikácia. Over si, čo presne držíš."},{t:"Neviem 🚩",e:"🚩",p:0,flag:!0,tip:"<b>🚩 Ak nevieš, koľko máš v čom, nevieš ani aké riziko nesieš.</b> Tematické a sektorové ETF vedia padnúť o 60 – 80 % a roky sa nespamätať. Prvý krok auditu: rozpísať si portfólio na percentá a zistiť, na čom reálne stojí."}]},{c:"D",q:"Časový test: vieš, ktoré tvoje investície sú po roku oslobodené od dane — a ktoré nebudú oslobodené nikdy?",a:[{t:"Viem presne, mám to nastavené vedome",e:"🧠",p:2},{t:"Počul som o tom",e:"🤔",p:1,tip:"<b>Časový test je najväčšia legálna daňová výhoda slovenského investora</b> — ale platí len pre niektoré nástroje. Over si, do ktorej skupiny patrí každý tvoj produkt."},{t:"Aký časový test? 😳",e:"😳",p:0,shock:!0,tip:"<b>ETF obchodované na burze sú po viac ako roku držania oslobodené od dane z výnosu. Podielové fondy nie — tam zaplatíš 19 % vždy.</b> Rovnaký trh, rovnaký výnos — úplne iné peniaze v ruke."}]},{c:"D",q:"Akumulačné vs. distribučné ETF: vieš, prečo na tom daňovo záleží?",a:[{t:"Viem — vybral som si vedome",e:"📄",p:2},{t:"Tuším rozdiel",e:"🤔",p:1,tip:"<b>Akumulačné ETF dividendy reinvestuje samo — distribučné ti ich vypláca a tým otvára daňovú otázku.</b> Pre dlhodobé budovanie majetku je voľba jasná, ale musí byť vedomá."},{t:"Prvýkrát počujem 😳",e:"😳",p:0,shock:!0,tip:"<b>Jedno písmeno v názve ETF (Acc/Dist) rozhoduje, či sa ti dividendy potichu skladajú, alebo riešiš daňové priznanie.</b> Detail, ktorý za 20 rokov spraví tisíce eur."}]},{c:"D",q:"Domicil fondu: vieš, prečo ti írske ETF môže ušetriť na dani z dividend?",a:[{t:"Viem",e:"🇮🇪",p:2},{t:"Niečo som čítal",e:"📖",p:1,tip:"<b>Domicil rozhoduje o zrážkovej dani z dividend vnútri fondu.</b> Írske UCITS ETF majú vďaka zmluve s USA výhodnejší režim — preto sú štandardom európskych investorov."},{t:"Čo je domicil? 😳",e:"😳",p:0,shock:!0,tip:"<b>Dve ETF na rovnaký index môžu mať rôzny čistý výnos len kvôli tomu, kde sú registrované.</b> Domicil je jeden z detailov, ktoré oddeľujú poskladané portfólio od náhodne nakúpeného."}]},{c:"C",q:"Vieš, na akú sumu investuješ — koľko potrebuješ na svoju rentu?",a:[{t:"Mám presné číslo aj dátum",e:"🎯",p:2},{t:"Zhruba tuším",e:"🤔",p:1,tip:"<b>Bez čísla nevieš, či ti stačí 100 € mesačne alebo potrebuješ 500.</b> Renta sa dá prepočítať na konkrétnu sumu a dátum — a celé portfólio sa potom stavia od konca."},{t:"Investujem „čo najviac” 😶",e:"😶",p:0,shock:!0,tip:"<b>„Čo najviac” nie je cieľ — je to pocit.</b> Cieľ má sumu, dátum a mesačný vklad. Kým ho nemáš, nevieš ani vyhodnotiť, či ti tvoje investovanie funguje."}]},{c:"C",q:"Sedí tvoj horizont s tým, do čoho investuješ?",a:[{t:"Áno — peniaze, ktoré budem skoro potrebovať, v akciách nemám",e:"✅",p:2},{t:"Neviem to posúdiť",e:"🤷",p:1,tip:"<b>Pravidlo: čo budeš potrebovať do ~5 rokov, nepatrí do akcií.</b> Prejdi si každý svoj cieľ (byt, auto, renta) a priraď mu správny nástroj podľa horizontu."},{t:"Peniaze, ktoré budem potrebovať o pár rokov, mám v akciách 🚩",e:"🚩",p:0,flag:!0,tip:"<b>🚩 Toto je najčastejší spôsob, ako sa z investora stane nútený predajca.</b> Ak trh spadne rok pred tým, než peniaze potrebuješ, predávaš v strate — bez ohľadu na to, aký dobrý bol plán."}]},{c:"C",q:"Máš najprv železnú rezervu — a až potom investície?",a:[{t:"Áno, 6 mesiacov výdavkov bokom",e:"🛡️",p:2},{t:"Čiastočne, buduje sa",e:"🟡",p:1,tip:"<b>Rezerva chráni tvoje investície pred tebou samým.</b> Bez nej každý nečakaný výdavok riešiš predajom portfólia — často v najhorší možný moment."},{t:"Investujem všetko, rezervu nemám 🚩",e:"🚩",p:0,flag:!0,tip:"<b>🚩 Investovanie bez rezervy je dom bez základov.</b> Prvá pokazená práčka alebo výpadok príjmu ťa donúti predávať — a trh sa nepýta, či je práve vhodný čas. Najprv rezerva, potom všetko ostatné."}]},{c:"C",q:"Kto ti staval tvoje súčasné portfólio?",a:[{t:"Kvalifikovaný investičný poradca s férovými poplatkami — je postavené na dátach, stratégii a rozumných krokoch",e:"🧠",p:2},{t:"Bankár / bežný poradca",e:"🏦",p:1,tip:"<b>Otázka nie je, či ti poradil dobre — otázka je, či vieš prečo a koľko za to platíš.</b> Vypýtaj si zdôvodnenie každého produktu a jeho poplatky. Kvalifikovaný poradca ti ich povie rád, predajca začne hmlieť."},{t:"Staval som ho sám podľa YouTube, kamarátov, internetu",e:"😅",p:0,tip:"<b>Internet ti dá informácie, ale nie stratégiu ani zodpovednosť.</b> Samostavané portfólio býva mix tipov bez systému — funguje, kým rastie trh. Audit ti ukáže, či máš systém, alebo zbierku náhod."}]},{c:"C",q:"Predstav si: investuješ 300 € mesačne do akciových ETF a po 20 rokoch máš 230 000 €. Chceš investovať ešte 10 rokov. Ako ich investuješ ďalej?",a:[{t:"Posledné roky ich budem postupne prekladať do dlhopisov a hotovosti",e:"🪜",p:2},{t:"Nechám všetko ďalších 10 rokov v akciách",e:"📈",p:1,tip:"<b>Odvážne — ale spočítaj si sekvenčné riziko.</b> Pád o 40 % rok pred čerpaním renty ti zoberie to, čo si 20 rokov staval. Posledné roky pred cieľom sa portfólio postupne upokojuje — presne načasovať to je remeslo."},{t:"Nikdy som nad tým neuvažoval 😳",e:"😳",p:0,shock:!0,tip:"<b>Toto je otázka, ktorá oddeľuje sporiteľov od investorov.</b> Najnebezpečnejšie roky celého investovania sú tie posledné — pád trhu tesne pred rentou ťa zasiahne najviac, lebo máš najviac v hre. Plán postupného presunu do konzervatívnych aktív sa stavia roky dopredu."}]}],ta=ot.length*2,na=Object.keys($n),Cr=e=>$n[e].replace(/^[^\p{L}\p{N}]+/u,""),bl={S:gc,P:ep,D:tp,C:fp},ra={S:"sage",P:"sand",D:"stone",C:"sage"},la=e=>e===1?"1 otázka":e<5?`${e} otázky`:`${e} otázok`,Sp=e=>{const t=e.indexOf(". ");return t>0?[e.slice(0,t
