ios amigos. 😄\n\nAk chceš vedieť, ako si postaviť vlastnú rentu, napíš mi. A pošli to niekomu, kto stále hovorí, že má čas.\n\nModelový príklad: výnos 10 % ročne, bez poplatkov, daní a inflácie. Minulé výnosy nie sú zárukou budúcich. Nie je to investičné odporúčanie, každý je v inej situácii."}, {"id": "v-poplatky", "name": "Poplatky 2,5 %", "typ": "Carousel", "n": 7, "d": "2026-11-09", "tema": "Investovanie", "styl": "Graf a čísla", "kde": "Stiahnuté › jsmentor-instagram › viralnych-5 › 2-poplatky-2-5-percenta", "cap": "Príde za mnou klient: „Ivan, mne v banke dali nulový vstupák.“ Super. Otvoríme spolu PDF s kľúčovými informáciami a ročný poplatok? 2,5 %. 😬\n\n2,5 % znie ako nič. Lenže ten poplatok nezaplatíš raz. Platíš ho každý rok z celého majetku. Pri 300 € mesačne na 30 rokov to v modelovom príklade robí rozdiel okolo 248 000 €. To je viac ako dvojnásobok toho, čo tam vôbec vložíš.\n\nInvestícia bez poplatkov neexistuje. Platíš peniazmi alebo časom. Ja sám beriem 1 % vstupný poplatok a hovorím to otvorene. Problém nie je poplatok. Problém je, keď o ňom nevieš.\n\nNevieš, koľko platíš ty? Napíš mi a pozrieme sa na to spolu. A pošli to kamošovi, ktorý má „výhodný“ fond z banky.\n\nModelový príklad: výnos trhu 10 % ročne pred poplatkami, bez daní. Minulé výnosy nie sú zárukou budúcich."}, {"id": "v-tri-ucty", "name": "Tri účty", "typ": "Carousel", "n": 6, "d": "2026-11-09", "tema": "Peniaze a život", "styl": "Graf a čísla", "kde": "Stiahnuté › jsmentor-instagram › viralnych-5 › 3-tri-ucty", "cap": "Máš všetky peniaze na jednom účte? Tak sa nečuduj, že na konci mesiaca nič nezostane. 🙈\n\nKoľko účtov máš ty? Napíš to do komentára. 👇\n\nNie preto, že by si bol zlý človek. Proste to vidíš a máš pocit, že to môžeš minúť. Ja preto odporúčam 3 účty:\n\n💳 Bežný účet: zhruba 1 mesačný príjem na bežné výdavky. Viac nie, lebo bežný účet nám garantuje stratu.\n💡 Účet na príležitosti: 6 mesačných výdavkov. Ja to nevolám rezervný účet, ja to volám účet na príležitosti. Pokaz   try { if (navigator.canShare && matchMedia('(pointer: coarse)').matches) { const files = await Promise.all(names.map(async (n, i) => new File([await (await fetch(file(p, i + 1))).blob()], n, { type: 'image/jpeg' })));
      if (navigator.canShare({ files })) { await navigator.share({ files }); return; } } } catch (e) { if (e && e.name === 'AbortError') return; }
  names.forEach((n, i) => setTimeout(() => { const a = document.createElement('a'); a.href = file(p, i + 1); a.download = n; document.body.appendChild(a); a.click(); a.remove(); }, i * 350));
  toast(p.n === 1 ? 'Sťahujem obrázok' : 'Sťahujem ' + p.n + ' obrázkov');
}

  else if (a === 'video-del') { const old = del('video', id); toast('Video zmazané', () => { S.videos[id] = old; push('video', id); location.hash = '#video/' + id; }); location.hash = '#videa'; return; }
