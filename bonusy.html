  <script>
    // Most medzi statickým webom a React aplikáciou /bonusy:
    // odkazy mimo /bonusy (logo, /komunita, /gdpr …) sa načítajú ako klasické statické stránky,
    // aby ich nezachytil React Router (ten pozná len /bonusy/*).
    (function () {
      var APP = "/bonusy";
      function inApp(p) { return p === APP || p.indexOf(APP + "/") === 0; }
      document.addEventListener("click", function (e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
        if (!a) return;
        var href = a.getAttribute("href");
        if (!href || href.charAt(0) === "#") return;
        if (a.target && a.target !== "_self") return;
        var u;
        try { u = new URL(a.href, window.location.href); } catch (err) { return; }
        if (u.origin !== window.location.origin || inApp(u.pathname)) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        window.location.assign(u.href);
      }, true);
      ["pushState", "replaceState"].forEach(function (m) {
        var orig = window.history[m];
        window.history[m] = function (state, title, url) {
          if (url != null) {
            try {
              var u = new URL(String(url), window.location.href);
              if (u.origin === window.location.origin && !inApp(u.pathname)) { window.location.assign(u.href); return; }
            } catch (err) {}
          }
          return orig.apply(this, arguments);
        };
      });
    })();
  </script>
